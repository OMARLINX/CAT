<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Sweeper Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .cat-game-body {
            font-family: 'Courier New', Courier, monospace;
        }
        .cell {
            width: 36px;
            height: 36px;
            background-color: #2a2a2a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid #3c3c3c;
            transition: transform 0.1s, background-color 0.1s;
            user-select: none;
        }
        .cell:hover {
            background-color: #383838;
            transform: scale(1.05);
        }
        .cell.revealed {
            background-color: #121212;
            border-color: #222;
            cursor: default;
            transform: none;
        }
        .cell.legendary {
            background-color: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            animation: pulse-gold 1s infinite alternate;
        }
        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 2px #ffd700; }
            100% { transform: scale(1.1); box-shadow: 0 0 10px #ffd700; }
        }
        .cell.dog {
            background-color: #d32f2f !important;
            animation: shake 0.3s;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(-1deg); }
            60% { transform: translate(-1px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .overlay-box {
            animation: popIn 0.3s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between cat-game-container selection:bg-amber-500 selection:text-slate-950">

    <!-- Header / Navbar com Botão de Voltar para o App -->
    <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="window.location.href='index.html'" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 transition" title="Back to Gallery">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="p-2.5 bg-amber-500/20 text-amber-400 rounded-xl border border-amber-500/30">
                    <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight">Cat Sweeper Arcade</h1>
                    <p class="text-xs text-slate-400">Mini-game Module</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Game Title with Click Easter Egg Trigger -->
        <h2 id="secret-trigger" class="text-xl font-bold text-amber-400 tracking-wider mb-3 cursor-pointer text-center" style="text-shadow: 0 0 10px rgba(255, 202, 40, 0.3);">🐱 CAT SWEEPER</h2>

        <!-- Top Records Bar -->
        <div class="bg-slate-900 border border-amber-500/40 rounded-xl p-3 w-[330px] mb-3 grid grid-cols-2 gap-2 text-xs">
            <div class="flex flex-col items-center bg-slate-950 p-2 rounded-lg border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase">Best Run</span>
                <strong id="rec-best" class="text-amber-400 text-sm mt-0.5">0 🐱</strong>
            </div>
            <div class="flex flex-col items-center bg-slate-950 p-2 rounded-lg border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase">Total Saved</span>
                <strong id="rec-total" class="text-amber-400 text-sm mt-0.5">0 🐱</strong>
            </div>
        </div>

        <!-- Current Match Panel -->
        <div class="flex justify-between items-center w-[330px] mb-3 bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
            <div>Cats: <strong id="cat-count" class="text-emerald-400">0</strong></div>
            <div>Target: <strong id="target-count" class="text-amber-400">5</strong></div>
            <div>Dogs: <strong id="dog-count" class="text-rose-400">8</strong></div>
        </div>

        <!-- The Grid 8x8 -->
        <div id="grid" class="grid grid-cols-8 gap-1.5 bg-slate-900 p-3.5 rounded-xl border border-slate-800 shadow-2xl"></div>

        <!-- Status Messages -->
        <div id="mensagem" class="mt-3 text-xs h-6 font-bold text-center"></div>

        <!-- Action Control (Stop & Save) -->
        <div class="mt-3 w-[330px]">
            <button id="btn-claim" class="w-full py-3.5 bg-emerald-400 text-slate-950 rounded-lg font-bold text-sm transition hover:bg-emerald-300 disabled:bg-slate-800 disabled:text-slate-600 disabled:border disabled:border-slate-700 disabled:cursor-not-allowed" onclick="resgatarPontos()" disabled>
                COLLECT (0 🐱)
            </button>
        </div>
    </main>

    <!-- Easter Egg Pop-up Modal -->
    <div id="easter-egg-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex flex-col justify-center items-center text-center p-4">
        <div class="overlay-box bg-slate-900 border-2 border-amber-400 p-6 rounded-2xl shadow-2xl max-w-xs w-full">
            <h3 id="ee-title" class="text-amber-400 text-lg font-bold mb-2">🐱 EASTER EGG!</h3>
            <div id="ee-icon" class="text-5xl my-2">👑</div>
            <p id="ee-text" class="text-slate-300 text-xs leading-relaxed my-3"></p>
            <button onclick="fecharEasterEgg()" class="w-full py-2.5 bg-amber-400 text-slate-950 font-bold rounded-xl mt-3 text-xs hover:bg-amber-300 transition">CONTINUE GAME</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>Cat Sweeper Arcade • Independent Module</p>
    </footer>

    <!-- Game Logic -->
    <script>
        const SIZE = 8;
        const DOGS = 8;
        const MIN_TARGET = 5;
        const EE_LEVEL_1 = 100;
        const EE_LEVEL_2 = 1000;

        let board = [];
        let gameOver = false;
        let catsFound = 0;
        let legendaryFound = 0;

        const COMMON_CATS = ['🐱', '😸', '😺', '😻', '😼', '😽', '🐈'];
        const LEGENDARY_CATS = ['👑🐱', '✨🐈', '🌟😺', '💎🐱'];

        let titleClicks = 0;
        let clickTimer = null;
        let currentStage = 1;

        document.getElementById('secret-trigger').addEventListener('click', () => {
            titleClicks++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { titleClicks = 0; }, 2000);

            if (currentStage === 1 && titleClicks >= 3) {
                currentStage = 2;
                mostrarEasterEgg("🛑 STOP CLICKING!", "🤡", "Bro... clicks on a static title?<br><br><b>Don't you have anything better to do? Go save some actual cats! Blyat!</b>");
            } else if (currentStage === 2 && titleClicks >= 4) {
                currentStage = 1;
                titleClicks = 0;
                mostrarEasterEgg("🧠 ARE YOU OKAY?!", "💀", "UNBELIEVABLE!<br><br><b>This is psychiatric levels of obsession. Take a break, go touch grass! Cycle reset! Blyat!</b>");
            }
        });

        function carregarRecords() {
            const bestRun = localStorage.getItem('cat_sweeper_best_run') || 0;
            const totalLifetime = localStorage.getItem('cat_sweeper_total_lifetime') || 0;
            document.getElementById('rec-best').innerText = bestRun + ' 🐱';
            document.getElementById('rec-total').innerText = totalLifetime + ' 🐱';
        }

        function checarEasterEggs(totalAntigo, totalNovo) {
            if (totalAntigo < EE_LEVEL_1 && totalNovo >= EE_LEVEL_1) {
                mostrarEasterEgg("🐈 CAT WHISPERER UNLOCKED!", "😸", `Blyat! You reached ${EE_LEVEL_1} Total Saved Cats!<br><br><i>"In soviet app, cats don't find you. You find cats!"</i>`);
            } else if (totalAntigo < EE_LEVEL_2 && totalNovo >= EE_LEVEL_2) {
                mostrarEasterEgg("👑 SUPREME CAT OVERLORD!", "🦁✨", `UNBELIEVABLE! You reached ${EE_LEVEL_2} Total Saved Cats!<br><br><b>Cabeçudo approves your dedication. You are an absolute legend!</b>`);
            }
        }

        function mostrarEasterEgg(titulo, icone, texto) {
            document.getElementById('ee-title').innerText = titulo;
            document.getElementById('ee-icon').innerHTML = icone;
            document.getElementById('ee-text').innerHTML = texto;
            document.getElementById('easter-egg-modal').classList.remove('hidden');
        }

        function fecharEasterEgg() {
            document.getElementById('easter-egg-modal').classList.add('hidden');
            iniciarJogo();
        }

        function salvarProgresso(pontosResgatados) {
            const currentBestRun = parseInt(localStorage.getItem('cat_sweeper_best_run') || '0', 10);
            if (pontosResgatados > currentBestRun) localStorage.setItem('cat_sweeper_best_run', pontosResgatados);

            const currentTotal = parseInt(localStorage.getItem('cat_sweeper_total_lifetime') || '0', 10);
            const novoTotal = currentTotal + pontosResgatados;
            localStorage.setItem('cat_sweeper_total_lifetime', novoTotal);

            carregarRecords();
            checarEasterEggs(currentTotal, novoTotal);
        }

        function iniciarJogo() {
            const grid = document.getElementById('grid');
            const msg = document.getElementById('mensagem');

            grid.innerHTML = '';
            msg.innerText = 'Find at least 5 cats before stopping!';
            msg.className = 'mt-3 text-xs h-6 font-bold text-center text-amber-400';
            
            gameOver = false;
            catsFound = 0;
            legendaryFound = 0;
            
            document.getElementById('dog-count').innerText = DOGS;
            atualizarPainel();

            board = [];
            for (let r = 0; r < SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    board[r][c] = { isDog: false, isLegendary: false, revealed: false, element: null };
                }
            }

            let dogsPlaced = 0;
            while (dogsPlaced < DOGS) {
                let r = Math.floor(Math.random() * SIZE);
                let c = Math.floor(Math.random() * SIZE);
                if (!board[r][c].isDog) { board[r][c].isDog = true; dogsPlaced++; }
            }

            let legendariesPlaced = 0;
            while (legendariesPlaced < 3) {
                let r = Math.floor(Math.random() * SIZE);
                let c = Math.floor(Math.random() * SIZE);
                if (!board[r][c].isDog && !board[r][c].isLegendary) { board[r][c].isLegendary = true; legendariesPlaced++; }
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.addEventListener('click', () => clicarCelula(r, c));
                    board[r][c].element = cellEl;
                    grid.appendChild(cellEl);
                }
            }
            carregarRecords();
        }

        function clicarCelula(r, c) {
            if (gameOver || board[r][c].revealed) return;

            const cell = board[r][c];
            cell.revealed = true;
            cell.element.classList.add('revealed');

            if (cell.isDog) {
                cell.element.classList.add('dog');
                cell.element.innerText = '🐕';
                gameOver = true;
                revelarCachorros();

                const msg = document.getElementById('mensagem');
                msg.innerText = 'Блять! A dog got you! Restarting in 2s...';
                msg.className = 'mt-3 text-xs h-6 font-bold text-center text-rose-400';
                document.getElementById('btn-claim').disabled = true;

                setTimeout(() => {
                    if (document.getElementById('easter-egg-modal').classList.contains('hidden')) {
                        iniciarJogo();
                    }
                }, 2000);
                return;
            }

            if (cell.isLegendary) {
                const rareCat = LEGENDARY_CATS[Math.floor(Math.random() * LEGENDARY_CATS.length)];
                cell.element.innerText = rareCat;
                cell.element.classList.add('legendary');
                catsFound += 2;
                legendaryFound++;
            } else {
                const commonCat = COMMON_CATS[Math.floor(Math.random() * COMMON_CATS.length)];
                cell.element.innerText = commonCat;
                catsFound++;
            }
            atualizarPainel();
        }

        function atualizarPainel() {
            document.getElementById('cat-count').innerText = catsFound;
            const btnClaim = document.getElementById('btn-claim');
            const msg = document.getElementById('mensagem');

            if (catsFound >= MIN_TARGET && !gameOver) {
                msg.innerText = `Target reached! Collect & Stop anytime!`;
                msg.className = 'mt-3 text-xs h-6 font-bold text-center text-emerald-400';
                btnClaim.disabled = false;
                btnClaim.innerText = `STOP & SAVE (${catsFound} 🐱)`;
            } else if (!gameOver) {
                btnClaim.disabled = true;
                btnClaim.innerText = `COLLECT (${catsFound}/${MIN_TARGET} 🐱)`;
            }
        }

        function resgatarPontos() {
            if (catsFound < MIN_TARGET || gameOver) return;
            gameOver = true;
            salvarProgresso(catsFound);

            const msg = document.getElementById('mensagem');
            msg.innerText = `🎉 Saved ${catsFound} cats! Starting new match in 2s...`;
            msg.className = 'mt-3 text-xs h-6 font-bold text-center text-emerald-400';
            document.getElementById('btn-claim').disabled = true;
            revelarCachorros();

            setTimeout(() => {
                if (document.getElementById('easter-egg-modal').classList.contains('hidden')) {
                    iniciarJogo();
                }
            }, 2000);
        }

        function revelarCachorros() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c].isDog) {
                        board[r][c].element.classList.add('cell', 'revealed', 'dog');
                        board[r][c].element.innerText = '🐕';
                    }
                }
            }
        }

        window.onload = () => {
            iniciarJogo();
            lucide.createIcons();
        };
    </script>
</body>
</html>
